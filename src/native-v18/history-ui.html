<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>已下载</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#1b1a1a;color:#e4e0e0;font:14px 'Microsoft YaHei',sans-serif}button,input{font:inherit}button{background:#343232;color:#e4e0e0;border:1px solid #514e4e;padding:6px 12px;cursor:pointer;border-radius:3px}button:hover{border-color:#52b35d}.danger{color:#f0b4aa;border-color:#805149}button:disabled{opacity:.45;cursor:default}input[type=text]{background:#252323;color:#eee;border:1px solid #514e4e;padding:6px 9px;width:190px}.toolbar{padding:14px 0 10px}.toolbar button{margin:0 6px 8px 0}.hint{color:#aaa;font-size:12px;padding-bottom:8px}#message{min-height:25px;color:#98ce9e;white-space:pre-wrap}#list{padding:0 12px 12px}.row{padding:14px 12px;margin-bottom:10px;border:1px solid #383535;background:#232121;position:relative;min-height:132px}.row.picked{border-color:#52a85c;background:#242e25}.pick{position:absolute;top:19px;left:12px;width:17px;height:17px}.content{margin-left:30px;margin-right:200px}.name{font-size:15px;word-break:break-all}.path{color:#999;font-size:12px;margin-top:8px;word-break:break-all}.meta{color:#8db895;font-size:12px;margin-top:5px}.actions{position:absolute;top:15px;right:12px}.actions button{display:block;width:150px;margin-bottom:8px}.empty{padding:60px 20px;text-align:center;color:#999}#selection{margin-left:8px;color:#aaa}#message.error{color:#f0a397}@media(max-width:650px){#list{padding:0 8px 8px}.content{margin-right:0}.actions{position:static;margin:12px 0 0 30px}.actions button{display:inline-block;width:auto;margin-right:8px}.toolbar{padding:10px}}
.messagebox{position:relative;margin:0 12px 12px;padding:10px 38px 10px 12px;background:#252b26;border:1px solid #465249;border-left:3px solid #62a46b}.messagetitle{font-size:12px;color:#bbb;margin-bottom:6px}#message{max-height:150px;overflow:auto;word-wrap:break-word}.messagebox .close{position:absolute;right:4px;top:5px;padding:0 8px;background:transparent;border:0;font-size:20px;color:#aaa}.toolbar{padding-left:12px;padding-right:12px}</style></head><body>
<div class="toolbar"><button id="selectAll">全选</button><button id="clear">取消选择</button><button id="remove" disabled>仅删除选中记录</button><button id="deleteFiles" class="danger" disabled>删除文件及记录</button><button id="refresh">刷新</button><input id="search" type="text" placeholder="搜索名称或目录"><span id="selection">已选 0 项</span>
<div class="hint">这里只管理下载记录与 resources 中的原始资源文件。卸载已安装版本请使用游戏管理。共享版本缓存暂不按单个版本删除。</div><div class="pages"><button id="prev">上一页</button><span id="page">1 / 1</span><button id="next">下一页</button></div></div><div id="messagebox" class="messagebox" role="status" aria-live="polite"><button id="messageclose" class="close" aria-label="关闭操作提示">×</button><div class="messagetitle">操作提示</div><div id="message">正在读取下载记录…</div></div><div id="list"></div>
<script>
(function(){'use strict';
var TOKEN='__MCPC_TOKEN__',items=[],selected={},busy=false,loading=false,pendingReload=false,page=0,pageSize=40,revision=null;
function el(id){return document.getElementById(id);}
function say(text,error){el('message').className=error?'error':'';el('message').innerText=text;el('messagebox').style.display=text?'block':'none';el('messageclose').disabled=busy;}
function request(method,url,done){var xhr=new XMLHttpRequest();xhr.open(method,url,true);xhr.setRequestHeader('X-MCPC-Token',TOKEN);xhr.timeout=url.indexOf('/api/history/delete-files?')===0?0:30000;var finished=false;function finish(err,data){if(finished)return;finished=true;done(err,data);}xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;var data;try{data=JSON.parse(xhr.responseText);}catch(e){finish('无法读取盒子的响应，请刷新重试。');return;}if(xhr.status!==200){finish(data.error||'操作失败');return;}finish(null,data);};xhr.onerror=function(){finish('无法连接盒子，请确认主程序仍在运行。');};xhr.ontimeout=function(){finish('操作超时，请刷新列表确认结果。');};xhr.send(null);}
function count(){var n=0;for(var k in selected)if(Object.prototype.hasOwnProperty.call(selected,k)&&selected[k])n++;return n;}
function update(){var n=count();el('selection').innerText='已选 '+n+' 项';el('remove').disabled=busy||!n;var groupSelected=false;for(var i=0;i<items.length;i++)if(selected[items[i].key]&&items[i].grouped)groupSelected=true;el('deleteFiles').disabled=busy||!n||groupSelected;el('selectAll').disabled=busy;el('clear').disabled=busy;el('refresh').disabled=busy;el('messageclose').disabled=busy;}
function visible(){var q=el('search').value.toLowerCase(),out=[];for(var i=0;i<items.length;i++)if((items[i].name+' '+items[i].path).toLowerCase().indexOf(q)>=0)out.push(items[i]);return out;}
function size(n){if(n>=1073741824)return(n/1073741824).toFixed(2)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return n+' B';}
function text(parent,tag,cls,value){var node=document.createElement(tag);node.className=cls;node.innerText=value;parent.appendChild(node);return node;}
function openFolder(item){if(busy)return;busy=true;update();request('POST','/api/history/open?keys='+item.key,function(err){busy=false;update();say(err||'已打开下载目录。',!!err);});}
function selectedKeys(){var keys=[];for(var k in selected)if(Object.prototype.hasOwnProperty.call(selected,k)&&selected[k])keys.push(k);return keys;}
function confirmFiles(keys){var details=[],grouped=false,chosen={};for(var j=0;j<keys.length;j++)chosen[keys[j]]=true;for(var i=0;i<items.length;i++)if(chosen[items[i].key]){details.push(items[i].name+'\n'+items[i].path);grouped=grouped||items[i].grouped;}
 if(grouped){say('版本任务只能清理记录，卸载版本请使用游戏管理。',true);return false;}return window.confirm('删除所选 '+keys.length+' 项的实际文件及下载记录？\n'+(grouped?'整体版本会删除整个安装文件夹，包含其下存档、模组和配置。\n':'')+'Windows 将尝试移入回收站；无法回收时会由系统提示。\n\n'+details.slice(0,8).join('\n\n')+(details.length>8?'\n……其余 '+(details.length-8)+' 项':''));}
function removeKeys(keys,files){if(busy||!keys.length)return;if(files&&!confirmFiles(keys))return;busy=true;render();var removed=0,errors=[],offset=0;
 function next(){if(offset>=keys.length){busy=false;load(function(err){say(err||((files?'已处理 '+removed+' 项文件及记录。':'已删除 '+removed+' 条记录，文件已保留。')+(errors.length?'\n'+errors.join('\n'):'')),!!err||!!errors.length);});return;}var start=offset+1,chunk=keys.slice(offset,offset+100);offset+=chunk.length;say((files?'正在批量删除文件：':'正在批量清理记录：')+'第 '+start+'—'+offset+' 项 / '+keys.length+' 项'+(files?'；可在 Windows 删除窗口中取消。':''));
 request('POST',(files?'/api/history/delete-files?keys=':'/api/history/remove?keys=')+chunk.join(','),function(err,data){if(err){errors.push(err);offset=keys.length;}else for(var i=0;i<data.results.length;i++){var r=data.results[i];if(r.removed){removed++;delete selected[r.key];}else errors.push(r.key+'：'+r.error);}next();});}next();}
function row(item){var node=document.createElement('div');node.className='row'+(selected[item.key]?' picked':'');var check=document.createElement('input');check.type='checkbox';check.className='pick';check.checked=!!selected[item.key];check.disabled=busy;check.setAttribute('aria-label','选择 '+item.name);check.onclick=function(){if(busy)return;selected[item.key]=check.checked;node.className='row'+(check.checked?' picked':'');update();};node.appendChild(check);var content=document.createElement('div');content.className='content';node.appendChild(content);text(content,'div','name',item.name||'未命名下载');text(content,'div','meta',(item.grouped?'版本下载任务':'原始资源文件')+' · '+size(item.bytes));text(content,'div','path',item.path||'未记录路径');var actions=document.createElement('div');actions.className='actions';node.appendChild(actions);var open=text(actions,'button','', item.grouped?'打开缓存目录':'打开目录');open.disabled=busy;open.onclick=function(){openFolder(item);};var remove=text(actions,'button','','仅删除记录');remove.disabled=busy;remove.onclick=function(){removeKeys([item.key],false);};var del=text(actions,'button','danger',item.grouped?'卸载请到游戏管理':'删除文件及记录');del.disabled=busy||item.grouped;del.onclick=function(){removeKeys([item.key],true);};return node;}
function render(){var list=el('list');while(list.firstChild)list.removeChild(list.firstChild);var rows=visible(),pages=Math.max(1,Math.ceil(rows.length/pageSize));if(page>=pages)page=pages-1;el('page').innerText=(page+1)+' / '+pages+' · '+rows.length+' 项';el('prev').disabled=busy||page===0;el('next').disabled=busy||page+1>=pages;
 if(!rows.length)text(list,'div','empty',items.length?'没有匹配的下载记录':'暂无已下载记录');else for(var i=page*pageSize;i<Math.min(rows.length,(page+1)*pageSize);i++)list.appendChild(row(rows[i]));update();}
function load(done,silent){if(loading){pendingReload=true;if(done)done('列表正在刷新，请稍后重试。');return;}loading=true;request('GET','/api/history',function(err,data){loading=false;if(!err){items=data.items;revision=data.revision;var keep={};for(var i=0;i<items.length;i++)if(selected[items[i].key])keep[items[i].key]=true;selected=keep;render();if(!done&&!silent)say('共 '+items.length+' 条下载记录。');}else if(!done)say(err,true);if(done)done(err);if(pendingReload){pendingReload=false;load();}});}
el('messageclose').onclick=function(){if(!busy)el('messagebox').style.display='none';};
el('selectAll').onclick=function(){if(busy)return;var rows=visible();for(var i=0;i<rows.length;i++)selected[rows[i].key]=true;render();};el('clear').onclick=function(){if(busy)return;selected={};render();};el('remove').onclick=function(){removeKeys(selectedKeys(),false);};el('deleteFiles').onclick=function(){removeKeys(selectedKeys(),true);};el('refresh').onclick=function(){if(!busy)load();};el('search').oninput=function(){page=0;render();};el('prev').onclick=function(){if(!busy&&page>0){page--;render();}};el('next').onclick=function(){if(!busy){page++;render();}};
load();setInterval(function(){if(!busy&&!loading&&!document.hidden)request('GET','/api/history/revision',function(err,data){if(!err&&data.revision!==revision&&!busy&&!loading)load(null,true);});},15000);
}());
</script></body></html>

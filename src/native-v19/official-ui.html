<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方版本下载</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#1b1a1a;color:#ddd;font:13px 'Microsoft YaHei',Arial,sans-serif}body{overflow-y:scroll}.wrap{padding:15px 16px}.title{font-size:20px;margin-bottom:8px;color:#eee}.sub{color:#9b9b9b;font-size:12px;line-height:20px;margin-bottom:12px}.bar,.task{padding:11px 12px;border:1px solid #3a3939;background:#232222;margin-bottom:10px}input,select,button{font:12px 'Microsoft YaHei',Arial,sans-serif}input,select{background:#191818;color:#ddd;border:1px solid #555;padding:6px}input{width:210px;max-width:42%}select{margin-left:5px;max-width:28%}button{background:#313131;color:#ddd;border:1px solid #555;padding:6px 11px;cursor:pointer}button:hover{border-color:#70a57a}button:disabled{color:#777;cursor:default}button.download{float:right;margin-left:12px;background:#258b3a;border-color:#359a49;color:#fff;padding:7px 18px}.item{overflow:hidden;min-height:66px;background:#232222;border:1px solid #353434;padding:12px 14px;margin-bottom:8px}.version{font-size:14px;color:#eee}.note{font-size:12px;color:#999;margin-top:6px}.label{color:#7bad84;font-size:11px;margin-left:8px}.error{color:#e9ba86;white-space:pre-wrap;word-wrap:break-word}.muted{color:#999}.progress{height:7px;background:#111;margin:10px 0;overflow:hidden}.fill{height:7px;background:#38984b;width:0}.tasktitle{font-size:14px;color:#eee}.taskline{font-size:12px;line-height:20px;word-wrap:break-word}.path{width:100%;max-width:100%;font-size:12px;margin:7px 0;color:#b6cdb9}.nav{padding:8px 0;text-align:center}.nav span{margin:0 10px;color:#aaa}#notice{font-size:12px;line-height:20px;word-wrap:break-word;margin:7px 0}.refresh{margin-left:5px}.empty{padding:30px;text-align:center;color:#999}@media(max-width:640px){.wrap{padding:10px}input{width:165px}.refresh{margin-top:7px}.download{padding:7px 11px!important}.sub{font-size:11px}}
.noticebox{position:relative;border:1px solid #444;background:#242824;padding:10px 38px 10px 12px;margin-bottom:12px}.close{float:right;font-size:18px;padding:0 8px;line-height:24px;background:transparent;border:0;color:#aaa}.noticebox .close{position:absolute;right:5px;top:5px}.disclosure{font-size:12px;color:#a5b9a9;background:transparent;border:0;padding:5px 0;margin-bottom:8px}.task{border-left:3px solid #38984b}.tasktitle{padding-right:28px}#taskerror{max-height:150px;overflow:auto}#taskmsg{max-height:64px;overflow:auto}.bar input,.bar select,.bar button{margin-bottom:5px}</style>
<script>
var TOKEN='__MCPC_TOKEN__',versions=[],latest={},selectedType='release',pageNo=0,pageSize=40,active=false,activeId='',activeState='',taskKey='',dismissedTask='',submitting=false,polling=false,actionEpoch=0,submitFailure=false; 
function get(id){return document.getElementById(id);}
function esc(s){return String(s===null||typeof s==='undefined'?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function api(method,url,done){var x=new XMLHttpRequest();x.open(method,url,true);x.setRequestHeader('X-MCPC-Token',TOKEN);x.timeout=65000;var finished=false;function finish(err,data){if(finished)return;finished=true;done(err,data);}x.onreadystatechange=function(){if(x.readyState!==4)return;var data;try{data=JSON.parse(x.responseText);}catch(e){finish('内置下载模块返回无效数据。');return;}if(x.status!==200){finish(data.error||('请求失败：'+x.status));return;}finish(null,data);};x.ontimeout=function(){finish('请求超时，请稍后重试。');};x.onerror=function(){finish('无法连接内置下载模块，请彻底退出盒子后重新打开；若仍失败，请反馈此提示。');};x.send(null);}
function setNotice(text,error){get('notice').className=error?'error':'muted';get('notice').innerHTML=esc(text);get('noticebox').style.display=text?'block':'none';}
function toggle(id,button){var open=get(id).style.display==='none';get(id).style.display=open?'block':'none';button.setAttribute('aria-expanded',open?'true':'false');}
function dismissTask(){if(active||submitting)return;dismissedTask=taskKey;get('task').style.display='none';try{sessionStorage.setItem('mcpc-dismiss-'+TOKEN,dismissedTask);}catch(e){}}
function buttonLabel(id){if(active&&id===activeId)return activeState==='preparing'?'准备中…':'下载中…';return active?'等待当前任务':'下载';}
function loadVersions(refresh){get('refresh').disabled=true;setNotice('正在从 Mojang 获取版本清单…',false);api('GET','/api/versions'+(refresh?'?refresh=1':''),function(err,data){get('refresh').disabled=false;if(err){setNotice(err,true);return;}versions=data.versions||[];latest=data.latest||{};pageNo=0;render();setNotice(data.cached?data.warning:'来源：Mojang 官方 · '+versions.length+' 个版本 · Windows '+data.architecture+' 位。',!!data.cached);});}
function typeName(t){return t==='release'?'正式版':t==='snapshot'?'快照 / 预发布':t==='old_beta'?'远古 Beta':t==='old_alpha'?'远古 Alpha':t;}
function render(){var q=get('search').value.replace(/^\s+|\s+$/g,'').toLowerCase(),list=[],i;selectedType=get('type').value;for(i=0;i<versions.length;i++){var v=versions[i];if(selectedType!=='all'&&v.type!==selectedType)continue;if(v.id.toLowerCase().indexOf(q)<0)continue;list.push(v);}var asc=get('sort').value==='asc';list.sort(function(a,b){var d=String(a.releaseTime).localeCompare(String(b.releaseTime));return asc?d:-d;});var pages=Math.max(1,Math.ceil(list.length/pageSize));pageNo=Math.max(0,Math.min(pageNo,pages-1));var html='';for(i=pageNo*pageSize;i<Math.min(list.length,(pageNo+1)*pageSize);i++){var t=list[i];html+='<div class="item"><button type="button" class="download" '+(active?'disabled':'')+' data-id="'+esc(t.id)+'" onclick="download(this.getAttribute(\'data-id\'))">'+esc(buttonLabel(t.id))+'</button><span class="version">Minecraft '+esc(t.id)+'</span>'+(t.id===latest.release?'<span class="label">最新正式版</span>':t.id===latest.snapshot?'<span class="label">最新快照</span>':'')+'<div class="note">'+esc(typeName(t.type))+' · '+esc(String(t.releaseTime).substring(0,10))+'</div></div>';}get('list').innerHTML=html||'<div class="empty">没有符合条件的版本</div>';get('page').innerHTML=(pageNo+1)+' / '+pages+' 页 · '+list.length+' 个版本';get('prev').disabled=pageNo<=0;get('next').disabled=pageNo>=pages-1;}
function changed(){pageNo=0;render();}
function download(id,probe){if(active||submitting)return;actionEpoch++;submitFailure=false;submitting=true;active=true;activeId=id;activeState='preparing';dismissedTask='';taskKey='submitting';render();get('task').style.display='block';get('taskclose').style.display='none';get('tasktitle').innerHTML='Minecraft '+esc(id)+' · 准备中';get('taskmsg').innerHTML='正在提交下载…';get('taskerror').innerHTML='';get('stats').innerHTML='';get('fill').style.width='0%';get('directory').value='';get('cancel').disabled=true;get('probe').disabled=true;api('POST',(probe?'/api/test-client':'/api/download')+'?id='+encodeURIComponent(id)+'&parallel='+(get('parallel').value||'8'),function(err){submitting=false;if(err){submitFailure=true;taskKey='submission-'+actionEpoch;active=false;activeState='failed';get('tasktitle').innerHTML='Minecraft '+esc(id)+' · 提交失败';get('taskerror').innerHTML=esc(err);get('taskclose').style.display='inline-block';get('probe').disabled=false;render();return;}poll();});}
function size(n){if(n>=1073741824)return(n/1073741824).toFixed(2)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';return(n/1024).toFixed(1)+' KB';}
function poll(){if(polling||submitting)return;polling=true;var epoch=actionEpoch;api('GET','/api/status',function(err,d){polling=false;if(submitting||epoch!==actionEpoch){if(!submitting)poll();return;}if(err){get('connection').innerHTML=esc(err);get('connectionbox').style.display='block';return;}get('connection').innerHTML='';get('connectionbox').style.display='none';if(submitFailure&&d.state!=='preparing'&&d.state!=='downloading')return;submitFailure=false;var was=active,oldId=activeId,oldState=activeState;active=d.state==='preparing'||d.state==='downloading';activeId=d.id||'';activeState=d.state;get('probe').disabled=active;get('parallel').disabled=active;if(was!==active||oldId!==activeId||oldState!==activeState)render();if(d.state==='idle')return;taskKey=String(d.taskId||d.id)+'|'+d.state;
get('task').style.display=(!active&&dismissedTask===taskKey)?'none':'block';get('taskclose').style.display=active?'none':'inline-block';get('tasktitle').innerHTML='Minecraft '+esc(d.id)+' · '+esc(d.state==='preparing'?'准备中':d.state==='downloading'?'下载中':d.state==='complete'?'任务完成':d.state==='cancelled'?'已取消':'失败');get('taskmsg').innerHTML=esc(d.message);get('taskerror').innerHTML=esc(d.error);var percent=d.totalBytes?Math.max(0,Math.min(active?99:100,d.doneBytes/d.totalBytes*100)):0;get('fill').style.width=percent.toFixed(1)+'%';get('stats').innerHTML=esc((d.doneFiles||0)+' / '+(d.totalFiles||0)+' 个文件 · '+size(d.doneBytes||0)+' / '+size(d.totalBytes||0)+(d.parallel?' · '+d.parallel+' 路':'')+(d.java?' · Java '+d.java:'')+' · 缓存复用 '+(d.cacheHits||0)+' 个 · 已安装复用 '+(d.localHits||0)+' 个 · 已复用 '+size(d.reusedBytes||0));get('directory').value=d.directory||'';get('cancel').disabled=!active;});}
function cancelDownload(){api('POST','/api/cancel',function(err){if(err)get('taskerror').innerHTML=esc(err);else get('taskmsg').innerHTML='正在取消，等待当前网络读取结束…';});}
function init(){try{dismissedTask=sessionStorage.getItem('mcpc-dismiss-'+TOKEN)||'';}catch(e){}loadVersions(false);poll();setInterval(poll,1800);}
</script></head><body onload="init()"><div class="wrap">
<div class="title">官方版本下载 <span style="font-size:11px;color:#86ad8b">共享缓存 · 原生下载</span></div>
<div class="sub">选择 Minecraft 版本，下载完成后在游戏列表中启动。</div><button class="disclosure" aria-expanded="false" onclick="toggle('help',this)">下载说明 / 高级选项</button><div id="help" class="bar" style="display:none"><div class="sub">动态读取 Mojang 官方版本；原下载模块统一管理任务和下载目录，共享缓存用于重试与重装。卸载版本请使用游戏管理。</div><select id="parallel" aria-label="下载并发"><option value="4">4 路（保守）</option><option value="8" selected>8 路（默认）</option><option value="16">16 路</option></select> <button id="probe" type="button" onclick="download('1.8.9',true)">测试原下载模块：1.8.9 客户端单文件</button><div class="note">此测试只校验客户端文件，不安装整套游戏。</div></div>
<div class="bar"><input id="search" aria-label="搜索版本" placeholder="搜索版本，例如 1.8.9" oninput="changed()" onkeyup="changed()"><select id="type" aria-label="版本分类" onchange="changed()"><option value="release">正式版</option><option value="snapshot">快照 / 预发布</option><option value="old_beta">远古 Beta</option><option value="old_alpha">远古 Alpha</option><option value="all">全部版本</option></select><select id="sort" aria-label="排序" onchange="changed()"><option value="desc">从新到旧</option><option value="asc">从旧到新</option></select><button type="button" id="refresh" class="refresh" onclick="loadVersions(true)">刷新清单</button></div><div id="noticebox" class="noticebox" style="display:none"><button class="close" aria-label="关闭版本清单提示" onclick="get('noticebox').style.display='none'">×</button><div id="notice"></div></div>
<div id="connectionbox" class="noticebox" style="display:none"><div class="error" id="connection" role="status"></div></div>
<div class="task" id="task" style="display:none" role="status" aria-live="polite"><button type="button" class="close" id="taskclose" style="display:none" aria-label="关闭已结束任务提示" onclick="dismissTask()">×</button><div class="tasktitle" id="tasktitle"></div><div class="progress"><div class="fill" id="fill"></div></div><div class="taskline muted" id="stats"></div><input id="directory" class="path" aria-label="安装目录" readonly onclick="this.select()"><button class="disclosure" aria-expanded="false" onclick="toggle('taskdetails',this)">查看下载说明</button><div id="taskdetails" class="taskline muted" style="display:none"><div class="taskline" id="taskmsg"></div>先校验共享缓存，再补齐缺失文件并复制到游戏目录。安装副本与缓存独立。下载中心按版本显示一条主任务，总进度包含全部文件。新安装默认使用简体中文，已有设置会保留。</div><div class="taskline error" id="taskerror"></div><button type="button" id="cancel" onclick="cancelDownload()">取消下载</button></div>
<div id="list"></div><div class="nav"><button type="button" id="prev" onclick="pageNo--;render()">上一页</button><span id="page"></span><button type="button" id="next" onclick="pageNo++;render()">下一页</button></div>
</div></body></html>
